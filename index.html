<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCR OK - Validation Conformité CR</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'%3E%3C/path%3E%3Cpolyline points='14 2 14 8 20 8'%3E%3C/polyline%3E%3Cpath d='M9 15l2 2 4-4'%3E%3C/path%3E%3C/svg%3E">
    
    <!-- STYLES & FONTS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- REACT & BABEL STANDALONE -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            /* Default - White */
            --app-bg: #f8fafc;
            --app-accent: #475569;
            --app-card-bg: #ffffff;
            --app-card-border: #e2e8f0;
            --app-header-bg: #1e293b;
            --app-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--app-bg);
            transition: background 0.5s ease;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* THEMES */
        body.theme-white { --app-bg: #f1f5f9; --app-accent: #64748b; --app-header-bg: #334155; --app-card-border: #e2e8f0; }
        
        .form-section {
            background: #ffffff;
            color: #1e293b;
            border-radius: 0.75rem;
            border: 2px solid transparent;
            border-top: 4px solid var(--app-card-border);
            padding: 0.5rem;
            box-shadow: var(--app-shadow);
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            position: relative;
        }

        .section-title { 
            color: var(--app-accent) !important; 
            border-bottom: 2px solid #f1f5f9; 
        }

        nav {
            background-color: var(--app-header-bg) !important;
            transition: background-color 0.5s ease;
        }

        .tooltip-trigger:hover .tooltip-box { opacity: 1; visibility: visible; }
        .tooltip-box {
            opacity: 0; visibility: hidden;
            pointer-events: none; z-index: 9999;
            width: max-content; max-width: 300px; min-width: 180px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            font-weight: 600; line-height: 1.3; white-space: normal;
            background: #1e293b; color: white; padding: 6px 10px;
            border-radius: 8px;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--app-accent); border-radius: 10px; opacity: 0.3; }

        .custom-scroll { scrollbar-width: thin; scrollbar-color: var(--app-accent) transparent; }

        .fira-code { font-family: 'Fira Code', monospace; }

        /* Professional Light Copy Button */
        .btn-copy {
            background: #ffffff;
            color: #2563eb;
            border: 2px solid #3b82f6;
            box-shadow: 0 1px 3px rgba(37, 99, 235, 0.1);
            transition: all 0.15s ease-in-out;
        }
        .btn-copy:hover:not(:disabled) { 
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #2563eb;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            transform: translateY(-1px);
        }
        .btn-copy:active:not(:disabled) {
            transform: translateY(0);
            background: #dbeafe;
        }
        .btn-copy:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            border-color: #e2e8f0;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Prevent synthesis selection */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
    </style>
</head>
<body class="h-screen w-screen m-0 p-0 overflow-hidden theme-white">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // --- CONSTANTS & TYPES MAPPING ---

        const AppType = {
            RACC: 'RACC',
            PLP: 'PLP',
            PLP_E2: 'PLP_E2',
            PLP_E3: 'PLP_E3'
        };

        const SourceType = {
            FILE: 'FILE',
            STOCK: 'STOCK'
        };

        const OPTIONS = {
            commDechets: ["Avant", "Après", "Complexe", "Nettoyé"],
            commEtiquette: ["Erronée", "Illisible", "Absente", "Manuscrite"],
            commJarretieres: ["Illisible", "Manuscrite", "Erronée", "Absente"],
            commCable: ["Illisible", "Manuscrite", "Erronée", "Absente", "Non gravée"],
            commRefPb: ["Illisible", "Erronée", "Absente"],
            commFibre: ["Erronée", "Illisible", "Absente"],
            commPhotoPtoPlp: [
                "Jarretière pas complètement visible",
                "PTO non entière",
                "PTO non fixée",
                "Photomètre non présent",
                "Photomètre non réglé sur 1490 ou 1577",
                "Mesure NC"
            ],
            suspicionOpts: ["Pto non fixée", "Photo avant travaux absente", "NC (si PLP > RACC)", "Jarr illisible complètement"],
            pbAvantOpts: ["Absente", "Cassette différente"],
            pbApresOpts: ["Absente", "Illisible", "Erronée"],
            voisinageOpts: ["KO", "Perte puissante", "Absent", "NC"],
            mesureExtra: ["Illisible", "Photomètre non réglé sur 1490 ou 1577", "Absente"]
        };

        const DESCRIPTIONS = {
            contact: "Avec = Appel entrant / Sans = Stock ou BL",
            presta: "Typologie RDV terrain différente du dossier (tag PLP mais RACC fait ou l'inverse)",
            Val_ROP: "Validation ROP faite (soit avec l'OI ou via eMutation -Reprovisioning à chaud rempli-)",
            desserte: "Type PBO dossier différent du terrain (onglet -PBO Infos complémentaires-)",
            pm_dechets: "Détection de déchets sur les images PM (NET = Nettoyé)",
            pm_cadrage: "Photo PM affiche tout le PM sans manque de partie",
            pm_ref_jarretieres: "Référence jarritière conforme au dossier",
            pm_mesure: "Mesure PM sur le photomètre conforme avec réglage de fréquence sur 1490 ou 1577",
            pto_conf: "PTO de BYTEL",
            pto_etiquette: "Référence PTO conforme au dossier et imprimé",
            pto_suspicion: "En cas de doute de fraude d'installation PTO",
            pto_mesure_avant: "Mesure PTO avant intervention (Spécifique E2)",
            pto_photo: "En cas de doute de fraude d'installation PTO",
            pto_mesure: "Mesure PTO sur le photomètre conforme (réglage 1490 or 1577)",
            pto_cadrage: "Cadrage correct de la Prise Terminale Optique",
            pbo_ref_cable: "Référence câble client sur le PBO conforme au dossier",
            pbo_ref_pb: "Référence PBO conforme au dossier",
            pbo_avant: ".. Avant raccordement",
            pbo_apres: ".. Après raccordement",
            pbo_cadrage: "PBO bien cadré on l'image",
            pbo_mesure_e2: "Mesure au PBO conforme (Obligatoire en E2)",
            autre_penetration: "Photo de point de pénétration de câble chez le client",
            autre_geoloc: "Toutes les photos géolocalisé et horodatées",
            autre_voisinage: "CV conforme (en OK avec le bon SERVID et FYT client)",
            autre_voisin_perturbe: "Pas de voisin(s) perturbé(s) sur le CheckV",
            autre_sauvage: "Incohérence ROP terrain et ROP dossier ou photos",
            autre_nacelle: "Photo nacelle géolocalisée, horodaté si intervention avec nacelle, sinon NA"
        };

        const TYPE_LABELS = {
            RACC: 'RACCORDEMENT',
            PLP: 'PLP',
            PLP_E2: 'PLP E2',
            PLP_E3: 'PLP E3'
        };

        const getPlaceholder = (text, isOk) => 
            `https://placehold.co/600x400/${isOk ? 'dcfce7/166534' : 'fee2e2/991b1b'}?text=${encodeURIComponent(text)}`;

        const VISUAL_GUIDES = [
            {
                id: 'pto_conf',
                title: 'PTO CONFORME',
                description: DESCRIPTIONS.pto_conf,
                cases: [
                { label: 'CONFORME (BYTEL)', status: 'ok', imageUrl: getPlaceholder('PTO BYTEL OK', true) },
                { label: 'NON CONFORME (Autre Opé)', status: 'ko', imageUrl: getPlaceholder('PTO ALIEN KO', false) }
                ]
            },
            {
                id: 'pbo_ref_cable',
                title: 'RÉF CABLE PBO',
                description: DESCRIPTIONS.pbo_ref_cable,
                cases: [
                { label: 'GRAVÉE / ÉTIQUETTE PRO (OK)', status: 'ok', imageUrl: getPlaceholder('REF GRAVÉE OK', true) },
                { label: 'MANUSCRITE', status: 'ko', imageUrl: getPlaceholder('MANUSCRITE', false) },
                { label: 'ILLISIBLE', status: 'ko', imageUrl: getPlaceholder('ILLISIBLE / FLOU', false) },
                { label: 'ERRONÉE', status: 'ko', imageUrl: getPlaceholder('REF ERRONÉE', false) },
                { label: 'NON GRAVÉE', status: 'ko', imageUrl: getPlaceholder('NON GRAVÉE', false) },
                { label: 'ABSENTE', status: 'ko', imageUrl: getPlaceholder('ABSENTE', false) }
                ]
            },
            {
                id: 'pto_etiquette',
                title: 'ÉTIQUETTE PTO',
                description: DESCRIPTIONS.pto_etiquette,
                cases: [
                { label: 'IMPRIMÉE & COLLÉE (OK)', status: 'ok', imageUrl: getPlaceholder('ETIQ IMPRIMÉE OK', true) },
                { label: 'MANUSCRITE', status: 'ko', imageUrl: getPlaceholder('MANUSCRITE', false) },
                { label: 'ILLISIBLE', status: 'ko', imageUrl: getPlaceholder('ILLISIBLE', false) },
                { label: 'ABSENTE', status: 'ko', imageUrl: getPlaceholder('ABSENTE', false) }
                ]
            },
            {
                id: 'pm_ref_jarretieres',
                title: 'RÉF JARRETIÈRE PM',
                description: DESCRIPTIONS.pm_ref_jarretieres,
                cases: [
                { label: 'ÉTIQUETTE VISIBLE (OK)', status: 'ok', imageUrl: getPlaceholder('ETIQ VISIBLE OK', true) },
                { label: 'MANUSCRITE', status: 'ko', imageUrl: getPlaceholder('MANUSCRITE', false) },
                { label: 'ILLISIBLE', status: 'ko', imageUrl: getPlaceholder('ILLISIBLE', false) },
                { label: 'ABSENTE', status: 'ko', imageUrl: getPlaceholder('ABSENTE', false) }
                ]
            },
            {
                id: 'pm_dechets',
                title: 'DÉCHETS PM',
                description: DESCRIPTIONS.pm_dechets,
                cases: [
                { label: 'PROPRE / PAS DE DÉCHETS (OK)', status: 'ok', imageUrl: getPlaceholder('PM PROPRE OK', true) },
                { label: 'DÉCHETS VISIBLES', status: 'ko', imageUrl: getPlaceholder('DÉCHETS AU SOL', false) }
                ]
            }
        ];

        const OUI_NON_OPTS = [
            { label: 'Oui', value: '1' },
            { label: 'Non', value: '0' }
        ];

        // --- GENERATOR UTILS ---

        const FIXED_SIGNATURE_ORDER = [
            { key: 'contact', label: 'CONTACT' },
            { key: 'presta', label: 'CHGT PRESTA' },
            { key: 'Val_ROP', label: 'VALIDATION ROP' },
            { key: 'desserte', label: 'CHGT DESSERTE' },
            { key: 'pm_dechets', label: 'DÉCHETS PM' },
            { key: 'pm_cadrage', label: 'CADRAGE PM' },
            { key: 'pm_ref_jarretieres', label: 'RÉF JARR.' },
            { key: 'pm_mesure', label: 'MESURE PM' },
            { key: 'pto_conf', label: 'PTO CONFORME' },
            { key: 'pto_etiquette', label: 'ÉTIQUETTE PTO' },
            { key: 'pto_suspicion', label: 'SUSPICION FRAUDE' },
            { key: 'pto_mesure_avant', label: 'MESURE PTO AVANT' },
            { key: 'pto_mesure', label: 'MESURE PTO' },
            { key: 'pto_photo', label: 'PHOTO PTO' },
            { key: 'pto_cadrage', label: 'CADRAGE PTO' },
            { key: 'pbo_ref_cable', label: 'RÉF CABLE' },
            { key: 'pbo_ref_pb', label: 'RÉF PB' },
            { key: 'pbo_avant', label: 'PHOTO PBO AVANT' },
            { key: 'pbo_apres', label: 'PHOTO PBO APRÈS' },
            { key: 'pbo_cadrage', label: 'CADRAGE PB' },
            { key: 'pbo_mesure_e2', label: 'MESURE E2' },
            { key: 'autre_penetration', label: 'PÉNÉTRATION' },
            { key: 'autre_geoloc', label: 'GÉOLOCALISATION' },
            { key: 'autre_voisinage', label: 'CHECKVOISINAGE' },
            { key: 'autre_voisin_perturbe', label: 'VOISIN PERTURBÉ' },
            { key: 'autre_sauvage', label: 'INC' },
            { key: 'autre_nacelle', label: 'NACELLE' },
            { key: 'autre_photo_poteau', label: 'POTEAU' }
        ];

        const SIGNATURE_COMMENT_MAP = {
            'pm_dechets': 'pm_comm_dechets',
            'pm_ref_jarretieres': 'pm_comm_jarretieres',
            'pm_mesure': 'pm_mesure_extra',
            'pto_etiquette': 'pto_comm_etiquette',
            'pto_suspicion': 'pto_comm_suspicion',
            'pto_mesure': 'pto_mesure_extra',
            'pto_photo': 'pto_comm_photo',
            'pbo_ref_cable': 'pbo_comm_cable',
            'pbo_ref_pb': 'pbo_comm_pb',
            'pbo_avant': 'pbo_comm_avant',
            'pbo_apres': 'pbo_comm_apres',
            'autre_voisinage': 'autre_comm_voisinage'
        };

        const formatUserSignature = (fullName) => {
            if (!fullName || !fullName.trim()) return "";
            
            const parts = fullName.trim().split(/\s+/);
            if (parts.length === 0) return "";
            
            const firstName = parts[0];
            const lastName = parts.length > 1 ? parts.slice(1).join("") : "";

            const f = firstName.substring(0, 2);
            const fFormatted = f.charAt(0).toUpperCase() + (f.length > 1 ? f.charAt(1).toLowerCase() : "");

            let lFormatted = "";
            if (lastName) {
                lFormatted = lastName.substring(0, 3).toUpperCase();
            } else if (firstName.length > 2) {
                lFormatted = firstName.substring(2, 5).toUpperCase();
            }

            return `${fFormatted}.${lFormatted}`;
        };

        const generateSynthesis = (type, data, importedContact, userName, importedSignature) => {
            const validationStatus = data['status'] || 'CONF';
            const f = (id) => data[id] || 'NA';

            const typeLabel = type === AppType.RACC ? 'RACC' : type === AppType.PLP_E3 ? 'E3' : type === AppType.PLP_E2 ? 'E2' : 'PLP';

            const tagsParts = [];

            tagsParts.push(typeLabel);
            tagsParts.push(validationStatus);

            FIXED_SIGNATURE_ORDER.forEach(item => {
                const key = item.key;
                const val = f(key);
                
                let displayVal = val === 'NA' ? 'NA' : (val === 'Cor' ? 'Cor' : (val === 'NET' ? 'NET' : (val === '1' ? '1' : '0')));
                
                if (key === 'contact') {
                    displayVal = val === 'NA' ? 'NA' : (val === '1' ? 'Avec' : 'Sans');
                } else if (['presta', 'Val_ROP', 'desserte', 'autre_voisin_perturbe', 'autre_sauvage'].includes(key)) {
                    if (val === 'Cor') displayVal = 'Cor';
                    else displayVal = val === 'NA' ? 'NA' : (val === '1' ? 'Oui' : 'Non');
                }

                const commentKey = SIGNATURE_COMMENT_MAP[key];
                const comment = commentKey ? data[commentKey] : null;

                let tagVal = displayVal;
                // Harmonisation : commentaire demandé si 0, Cor ou NET (ex: pour préciser le type de déchet nettoyé)
                if (comment && comment.trim() !== '') {
                    if (val === '0' || val === 'Cor' || val === 'NET') {
                        tagVal += ` (${comment.trim()})`;
                    }
                }
                
                tagsParts.push(tagVal);
            });

            const typeTitle = type === AppType.RACC ? 'RACCORDEMENT' : type === AppType.PLP_E3 ? 'PLP E3' : type === AppType.PLP_E2 ? 'PLP E2' : 'PLP';
            
            const currentContactLabel = data['contact'] === '1' ? 'Avec' : 'Sans';
            const currentAbbrev = userName ? formatUserSignature(userName) : '';
            
            let contactLine = '';

            if (importedContact) {
                const importedLabel = importedContact === '1' ? 'Avec' : (importedContact === '0' ? 'Sans' : importedContact);
                const sig1 = importedSignature ? ` (${importedSignature})` : '';
                const sig2 = currentAbbrev ? ` (${currentAbbrev})` : '';
                
                contactLine = `C1${sig1} : ${importedLabel} / C2${sig2} : ${currentContactLabel}`;
            } else {
                const sig1 = currentAbbrev ? ` (${currentAbbrev})` : '';
                contactLine = `C1${sig1} : ${currentContactLabel}`;
            }

            let output = `*** CR ${typeTitle} ***\n${contactLine}\n${validationStatus}\n`;

            const addLine = (label, id, format = 'tri', commId) => {
                const val = f(id);
                if (val === 'NA') return "";
                
                let displayVal = val;
                if (val === 'Cor') {
                    displayVal = 'Cor';
                } else if (val === 'NET') {
                    displayVal = 'NET';
                } else if (format === 'contact') {
                    displayVal = (val === '1' ? 'Avec' : 'Sans');
                } else if (format === 'ouinon' || format === 'voisin') {
                    displayVal = (val === '1' ? 'Oui' : 'Non');
                } else {
                    displayVal = (val === '1' ? '1' : '0');
                }
                
                const comm = commId ? data[commId] : null;
                return `${label} : ${displayVal}${comm && comm.trim() !== '' ? ` (${comm.trim()})` : ''}\n`;
            };

            let genContent = "";
            genContent += addLine('CONTACT', 'contact', 'contact');
            genContent += addLine('Chgt Presta', 'presta', 'ouinon');
            genContent += addLine('Validation ROP', 'Val_ROP', 'ouinon');
            genContent += addLine('Chgt Desserte', 'desserte', 'ouinon');
            if (genContent) output += genContent;

            let pmContent = "";
            pmContent += addLine('Déchets PM', 'pm_dechets', 'tri', 'pm_comm_dechets');
            if (f('pm_cadrage') !== '1') pmContent += addLine('Cadrage PM', 'pm_cadrage', 'tri');
            if (f('pm_ref_jarretieres') !== '1') pmContent += addLine('Réf JARR.', 'pm_ref_jarretieres', 'tri', 'pm_comm_jarretieres');
            if (f('pm_mesure') !== '1') pmContent += addLine('Mesure PM', 'pm_mesure', 'tri', 'pm_mesure_extra');
            if (pmContent) output += `------------------------- PM -------------------------\n${pmContent}`;

            let ptoContent = "";
            if (f('pto_conf') !== '1') ptoContent += addLine('PTO Conforme', 'pto_conf', 'tri');
            if (f('pto_etiquette') !== '1') ptoContent += addLine('Étiquette PTO', 'pto_etiquette', 'tri', 'pto_comm_etiquette');
            if (f('pto_suspicion') !== '1') ptoContent += addLine('Suspicion fraude', 'pto_suspicion', 'tri', 'pto_comm_suspicion');
            if (f('pto_mesure_avant') !== '1') ptoContent += addLine('Mesure PTO avant', 'pto_mesure_avant', 'tri');
            if (f('pto_mesure') !== '1') ptoContent += addLine('Mesure PTO', 'pto_mesure', 'tri', 'pto_mesure_extra');
            if (f('pto_photo') !== '1') ptoContent += addLine('Photo PTO', 'pto_photo', 'tri', 'pto_comm_photo');
            if (f('pto_cadrage') !== '1') ptoContent += addLine('Cadrage PTO', 'pto_cadrage', 'tri');
            if (ptoContent) output += `------------------------- PTO -------------------------\n${ptoContent}`;

            let pboContent = "";
            if (f('pbo_ref_cable') !== '1') pboContent += addLine('Réf Cable', 'pbo_ref_cable', 'tri', 'pbo_comm_cable');
            if (f('pbo_ref_pb') !== '1') pboContent += addLine('Réf PB', 'pbo_ref_pb', 'tri', 'pbo_comm_pb');
            if (f('pbo_avant') !== '1') pboContent += addLine('Photo PBO avant', 'pbo_avant', 'tri', 'pbo_comm_avant');
            if (f('pbo_apres') !== '1') pboContent += addLine('Photo PBO après', 'pbo_apres', 'tri', 'pbo_comm_apres');
            if (f('pbo_cadrage') !== '1') pboContent += addLine('Cadrage PB', 'pbo_cadrage', 'tri');
            if (f('pbo_mesure_e2') !== '1') pboContent += addLine('Mesure E2', 'pbo_mesure_e2', 'tri');
            if (pboContent) output += `------------------------- PBO -------------------------\n${pboContent}`;

            let autreContent = "";
            if (f('autre_penetration') !== '1') autreContent += addLine('Pénétration', 'autre_penetration', 'tri');
            if (f('autre_geoloc') !== '1') autreContent += addLine('Géolocalisation', 'autre_geoloc', 'tri');
            if (f('autre_voisinage') !== '1') autreContent += addLine('CheckVoisinage', 'autre_voisinage', 'tri', 'autre_comm_voisinage');
            if (f('autre_voisin_perturbe') !== '0') autreContent += addLine('Voisin Perturbé', 'autre_voisin_perturbe', 'voisin');
            if (f('autre_sauvage') !== '0') autreContent += addLine('INC', 'autre_sauvage', 'ouinon');
            if (f('autre_nacelle') !== '1') autreContent += addLine('Nacelle', 'autre_nacelle', 'tri');
            if (f('autre_photo_poteau') !== '1') autreContent += addLine('Poteau', 'autre_photo_poteau', 'tri');
            if (autreContent) output += `------------------------- AUTRE -------------------------\n${autreContent}`;

            const tagsLine = `[[${tagsParts.join('\\')}]]`;
            
            return `${tagsLine}\n${output.trim()}`.replace(/\n{3,}/g, '\n\n');
        };

        // --- ICONS ---

        const GeneralIcon = () => (
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        );

        const PMIcon = () => (
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/></svg>
        );

        const PTOIcon = () => (
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        );

        const PBOIcon = () => (
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        );

        const AutreIcon = () => (
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
        );

        const SynthesisIcon = () => (
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        );

        const CopyIcon = () => (
            <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        );

        const ResetIcon = () => (
            <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
        );

        // --- COMPONENTS ---

        const Tooltip = ({ text }) => {
            if (!text) return null;
            return (
                <div className="tooltip-trigger relative inline-block ml-1 group/tooltip">
                <svg className="w-3.5 h-3.5 text-slate-400 hover:text-[var(--app-accent)] transition-colors cursor-help" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <div className="tooltip-box absolute bottom-full left-1/2 -translate-x-1/2 mb-2 text-center z-[9999] opacity-0 invisible group-hover/tooltip:opacity-100 group-hover/tooltip:visible pointer-events-none transition-all duration-200 translate-y-2 group-hover/tooltip:translate-y-0">
                    <div className="relative bg-[#1e293b] text-white p-2 rounded-lg shadow-xl text-[10px] font-semibold min-w-[150px] max-w-[250px] leading-tight whitespace-normal">
                    {text}
                    <div className="absolute top-full left-1/2 -translate-x-1/2 border-[6px] border-transparent border-t-[#1e293b]"></div>
                    </div>
                </div>
                </div>
            );
        };

        const ToggleGroup = ({ 
            label, value, onChange, isTriState = false, hasCor = false, colorReversed = false, disabled = false, description = "", variant = 'default',
            options = [{ label: '1', value: '1' }, { label: '0', value: '0' }]
        }) => {
            let finalOptions = [...options];
            if (hasCor) finalOptions.push({ label: 'Cor', value: 'Cor' });
            if (isTriState) finalOptions.push({ label: 'NA', value: 'NA' });

            return (
                <div className={`flex flex-col gap-1 mb-1 group ${disabled ? 'pointer-events-none opacity-80' : ''}`}>
                <div className="flex items-center">
                    <label className={`text-[0.7rem] font-[800] uppercase tracking-[0.05em] leading-[1.3] text-[#64748b] transition-colors ${disabled ? 'opacity-50' : 'opacity-100'}`}>
                    {label}{!disabled && <span className="text-red-500 ml-0.5">*</span>}
                    </label>
                    {description && <Tooltip text={description} />}
                </div>
                <div className={`toggle-container flex rounded-lg overflow-hidden border border-black/5 shadow-sm h-8 w-[95%] shrink-0 ${disabled ? 'bg-slate-200/50' : 'bg-black/5'}`}>
                    {finalOptions.map((opt) => {
                    const isActive = value === opt.value;
                    let activeClass = "";
                    
                    if (isActive) {
                        if (opt.value === 'Cor') {
                            activeClass = "bg-amber-500 text-white shadow-inner scale-105 z-10";
                        } else if (opt.value === 'NET') {
                            activeClass = "bg-cyan-500 text-white shadow-inner scale-105 z-10";
                        } else if (variant === 'informative') {
                            if (opt.value === '1') activeClass = "bg-blue-600 text-white shadow-md scale-105 z-10";
                            else if (opt.value === '0') activeClass = "bg-white text-blue-600 shadow-md scale-105 z-10 ring-1 ring-blue-100";
                            else activeClass = "bg-slate-400 text-white shadow-inner scale-105 z-10";
                        } else if (colorReversed) {
                            if (opt.value === '0') activeClass = "bg-emerald-500 text-white shadow-inner scale-105 z-10";
                            else if (opt.value === '1') activeClass = "bg-red-500 text-white shadow-inner scale-105 z-10";
                            else activeClass = "bg-slate-500 text-white shadow-inner scale-105 z-10";
                        } else {
                            if (opt.value === '1') activeClass = "bg-emerald-500 text-white shadow-inner scale-105 z-10";
                            else if (opt.value === '0') activeClass = "bg-red-500 text-white shadow-inner scale-105 z-10";
                            else activeClass = "bg-slate-500 text-white shadow-inner scale-105 z-10";
                        }
                    } else {
                        activeClass = "opacity-40";
                    }

                    return (
                        <button
                        key={opt.value}
                        type="button"
                        disabled={disabled}
                        onClick={() => !disabled && onChange(opt.value)}
                        className={`flex-1 text-[9px] font-black uppercase tracking-tighter transition-all duration-200 ${disabled ? '' : 'active:scale-90'} ${activeClass}`}
                        >
                        {opt.label}
                        </button>
                    );
                    })}
                </div>
                </div>
            );
        };

        const DatalistInput = ({ label, value, onChange, options, isVisible, description = "" }) => {
            if (!isVisible) return null;

            return (
                <div className="flex flex-col gap-1 mb-1 animate-in fade-in slide-in-from-top-1 duration-200">
                <div className="flex items-center">
                    <label className="text-[0.7rem] font-[800] uppercase tracking-[0.05em] leading-[1.3] text-[#64748b] opacity-100">{label}<span className="text-red-500 ml-0.5">*</span></label>
                    {description && <Tooltip text={description} />}
                </div>
                <input
                    type="text"
                    list={`list-${label.replace(/\s+/g, '')}`}
                    value={value}
                    onChange={(e) => onChange(e.target.value)}
                    placeholder="Choisir..."
                    className="w-full rounded-lg px-2 py-1 text-[10px] font-bold focus:outline-none focus:ring-1 focus:ring-[var(--app-accent)] transition-all shadow-inner border border-black/5 bg-white/80"
                />
                <datalist id={`list-${label.replace(/\s+/g, '')}`}>
                    {options.map((opt, i) => (
                    <option key={i} value={opt} />
                    ))}
                </datalist>
                </div>
            );
        };

        const Section = ({ id, title, icon, isVisible, baseColor, isActive, onActivate, children }) => {
            if (!isVisible) return null;
            
            const colorMap = {
                sky: 'border-sky-500',
                emerald: 'border-emerald-500',
                amber: 'border-amber-500',
                rose: 'border-rose-500',
                purple: 'border-purple-500'
            };

            const bgMap = {
                sky: 'bg-sky-500',
                emerald: 'bg-emerald-500',
                amber: 'bg-amber-500',
                rose: 'bg-rose-500',
                purple: 'bg-purple-500'
            };

            return (
                <div 
                onClick={onActivate}
                className={`form-section cursor-pointer bg-white transition-colors duration-200 ${
                    isActive 
                    ? `${colorMap[baseColor] || 'border-slate-500'} shadow-md` 
                    : 'border-transparent'
                }`}
                >
                <h3 className={`section-title flex items-center justify-center gap-2 font-black text-[10px] uppercase tracking-[0.2em] mb-1.5 py-1.5 rounded transition-colors duration-200 ${
                    isActive 
                    ? `${bgMap[baseColor] || 'bg-slate-500'} !text-white !border-b-0` 
                    : `!text-${baseColor}-600`
                }`}>
                    {icon} {title}
                </h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-2 gap-y-0.5 px-0.5">
                    {children}
                </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---

        const App = () => {
            const [userName, setUserName] = useState('');
            const [type, setType] = useState(AppType.RACC);
            const [sourceType, setSourceType] = useState(SourceType.FILE);
            const [theme, setTheme] = useState('white');
            const [formData, setFormData] = useState({ status: '' });
            const [analysisInput, setAnalysisInput] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isDocOpen, setIsDocOpen] = useState(false);
            const [docTab, setDocTab] = useState('visual');
            const [importedContactValue, setImportedContactValue] = useState(undefined);
            const [importedSignature, setImportedSignature] = useState('');
            const [activeSection, setActiveSection] = useState('general');
            const textareaRef = useRef(null);

            const ALL_KEYS = [
                'contact', 'presta', 'Val_ROP', 'desserte',
                'pm_dechets', 'pm_comm_dechets', 'pm_cadrage', 'pm_ref_jarretieres', 'pm_mesure',
                'pto_conf', 'pto_etiquette', 'pto_suspicion', 'pto_mesure_avant', 'pto_mesure', 'pto_photo', 'pto_cadrage',
                'pbo_ref_cable', 'pbo_ref_pb', 'pbo_avant', 'pbo_apres', 'pbo_cadrage', 'pbo_mesure_e2',
                'autre_penetration', 'autre_geoloc', 'autre_voisinage', 'autre_voisin_perturbe', 'autre_sauvage', 'autre_nacelle', 'autre_photo_poteau'
            ];

            const KEY_TO_HUMAN_LABEL = {
                'contact': 'CONTACT', 'presta': 'CHGT PRESTA', 'Val_ROP': 'VALIDATION ROP', 'desserte': 'CHGT DESSERTE',
                'pm_dechets': 'DÉCHETS PM', 'pm_comm_dechets': 'COMM DÉCHETS PM', 'pm_cadrage': 'CADRAGE PM', 'pm_ref_jarretieres': 'RÉF JARR.', 'pm_comm_jarretieres': 'COMM JARR.', 'pm_mesure': 'MESURE PM', 'pm_mesure_extra': 'DÉTAIL MESURE PM',
                'pto_conf': 'PTO CONFORME', 'pto_etiquette': 'ÉTIQUETTE PTO', 'pto_comm_etiquette': 'COMM ETIQ. PTO', 'pto_suspicion': 'SUSPICION FRAUDE', 'pto_comm_suspicion': 'DÉTAIL SUSPICION', 'pto_mesure_avant': 'MESURE PTO AVANT', 'pto_mesure': 'MESURE PTO', 'pto_mesure_extra': 'DÉTAIL MESURE PTO', 'pto_photo': 'PHOTO PTO', 'pto_comm_photo': 'COMM PHOTO PTO', 'pto_cadrage': 'CADRAGE PTO',
                'pbo_ref_cable': 'RÉF CABLE', 'pbo_comm_cable': 'COMM CABLE', 'pbo_ref_pb': 'RÉF PB', 'pbo_comm_pb': 'COMM RÉF PB', 'pbo_avant': 'PHOTO PBO AVANT', 'pbo_comm_avant': 'COMM PBO AVANT', 'pbo_apres': 'PHOTO PBO APRÈS', 'pbo_comm_apres': 'COMM PBO APRÈS', 'pbo_cadrage': 'CADRAGE PB', 'pbo_mesure_e2': 'MESURE E2',
                'autre_penetration': 'PÉNÉTRATION', 'autre_geoloc': 'GÉOLOCALISATION', 'autre_voisinage': 'CHECKVOISINAGE', 'autre_comm_voisinage': 'COMM. CHECKV.', 'autre_voisin_perturbe': 'VOISIN PERTURBÉ', 'autre_sauvage': 'INC', 'autre_nacelle': 'NACELLE', 'autre_photo_poteau': 'POTEAU'
            };

            const COMMENT_FIELDS_MAP = {
                'pm_dechets': 'pm_comm_dechets', 'pm_ref_jarretieres': 'pm_comm_jarretieres', 'pm_mesure': 'pm_mesure_extra',
                'pto_etiquette': 'pto_comm_etiquette', 'pto_suspicion': 'pto_comm_suspicion', 'pto_mesure': 'pto_mesure_extra',
                'pto_photo': 'pto_comm_photo', 'pbo_ref_cable': 'pbo_comm_cable', 'pbo_ref_pb': 'pbo_comm_pb',
                'pbo_avant': 'pbo_comm_avant', 'pbo_apres': 'pbo_comm_apres', 'autre_voisinage': 'autre_comm_voisinage'
            };

            const isFieldVisible = useCallback((id, currentType) => {
                if (id === 'pto_mesure_avant') return currentType === AppType.PLP_E2;
                if (id === 'pbo_mesure_e2') return currentType === AppType.PLP_E2;
                if (['pto_photo', 'pto_comm_photo'].includes(id)) return currentType === AppType.PLP;
                if (currentType === AppType.RACC || currentType === AppType.PLP_E2) return true;
                if (currentType === AppType.PLP) {
                    if (['pto_etiquette', 'pto_mesure'].includes(id)) return true;
                    if (['pm_dechets', 'pm_comm_dechets', 'pm_mesure'].includes(id)) return true;
                    if (['autre_voisinage'].includes(id)) return true; 
                    return false;
                }
                if (currentType === AppType.PLP_E3) {
                    const hiddenInE3 = ['pbo_ref_cable', 'pbo_ref_pb', 'pbo_avant', 'pbo_apres', 'pbo_cadrage', 'pbo_mesure_e2', 'autre_nacelle', 'autre_photo_poteau'];
                    return !hiddenInE3.includes(id);
                }
                return true;
            }, []);

            const isBlockVisible = useCallback((ids) => ids.some(id => isFieldVisible(id, type)), [isFieldVisible, type]);

            const calculateStatus = useCallback((data, currentType, hasImportedContact) => {
                const informativeFields = ['contact', 'presta', 'Val_ROP', 'desserte'];
                const techFields = ALL_KEYS.filter(k => 
                    isFieldVisible(k, currentType) && 
                    !k.includes('_comm_') && 
                    !k.includes('_extra') && 
                    !informativeFields.includes(k)
                );
                
                let hasKO = false; 
                let hasCor = false;
                
                for (const key of techFields) {
                    const val = data[key];
                    if (val === 'Cor' || val === 'NET') hasCor = true;
                    else if (['autre_voisin_perturbe', 'autre_sauvage'].includes(key)) { if (val === '1') hasKO = true; }
                    else { if (val === '0') hasKO = true; }
                }
                
                if (hasKO) return 'NC';
                if (hasCor) return hasImportedContact ? 'COR APR' : 'COR PND';
                return 'CONF';
            }, [isFieldVisible]);

            const getDefaultFormData = useCallback((currentType, currentSource) => {
                const data = { status: '' };
                ALL_KEYS.forEach(key => {
                    if (isFieldVisible(key, currentType)) {
                        if (key === 'pm_comm_dechets') data[key] = '';
                        else if (key === 'contact') data[key] = currentSource === SourceType.FILE ? '1' : '0';
                        else if (key === 'pto_mesure_avant' && currentType === AppType.PLP_E2) data[key] = '1';
                        else if (key === 'pbo_mesure_e2' && currentType === AppType.PLP_E2) data[key] = '1';
                        else if (['pbo_mesure_e2', 'autre_nacelle', 'autre_photo_poteau'].includes(key)) data[key] = 'NA';
                        else if (['presta', 'Val_ROP', 'desserte', 'autre_voisin_perturbe', 'autre_sauvage'].includes(key)) data[key] = '0';
                        else data[key] = '1';
                    } else { data[key] = 'NA'; }
                });
                data.status = calculateStatus(data, currentType, false) || 'CONF';
                return data;
            }, [isFieldVisible, calculateStatus]);

            const updateField = useCallback((id, value) => {
                setFormData(prev => {
                    const newData = { ...prev, [id]: value };
                    if (id !== 'status') {
                        const newStatus = calculateStatus(newData, type, importedContactValue !== undefined);
                        if (newStatus) newData.status = newStatus;
                    }
                    return newData;
                });
            }, [calculateStatus, type, importedContactValue]);

            const handleDossierVide = () => {
                const newData = { ...formData };
                ALL_KEYS.forEach(key => {
                    if (!isFieldVisible(key, type)) return;
                    if (key === 'contact') return;
                    if (key.includes('_comm_') || key.includes('_extra')) return;

                    if (['autre_voisin_perturbe', 'autre_sauvage'].includes(key)) newData[key] = '1';
                    else if (['presta', 'Val_ROP', 'desserte'].includes(key)) newData[key] = '0';
                    else if (key !== 'status') newData[key] = '0';

                    const commentField = COMMENT_FIELDS_MAP[key];
                    if (commentField) newData[commentField] = (key === 'pm_dechets') ? 'Dossier vide' : '.';
                    if (key === 'pm_mesure') newData['pm_mesure_extra'] = '.';
                    if (key === 'pto_mesure') newData['pto_mesure_extra'] = '.';
                    if (key === 'pm_ref_jarretieres') newData['pm_comm_jarretieres'] = '.';
                    if (key === 'pto_etiquette') newData['pto_comm_etiquette'] = '.';
                    if (key === 'pto_suspicion') newData['pto_comm_suspicion'] = '.';
                });
                newData['pm_comm_dechets'] = 'Dossier vide';
                newData['pm_dechets'] = '0';
                newData.status = calculateStatus(newData, type, importedContactValue !== undefined);
                setFormData(newData);
                Swal.fire({ icon: 'warning', title: 'Dossier Vide Appliqué', text: 'Tous les éléments ont été mis en Non-Conforme.', timer: 1500, showConfirmButton: false, toast: true, position: 'top-end' });
            };

            useEffect(() => { document.body.className = `theme-${theme}`; }, [theme]);

            useEffect(() => {
                const storedUser = sessionStorage.getItem('vcr_username');
                if (storedUser) {
                    setUserName(storedUser);
                } else {
                    Swal.fire({
                        title: 'Bienvenue',
                        text: 'Veuillez saisir votre Prénom et NOM',
                        input: 'text',
                        inputPlaceholder: 'Ex: Jacques DUPONT',
                        allowOutsideClick: false,
                        allowEscapeKey: false,
                        confirmButtonText: 'Valider',
                        confirmButtonColor: '#1e293b',
                        backdrop: `rgba(0,0,0,0.8)`,
                        inputValidator: (value) => {
                            if (!value) return 'La saisie est obligatoire pour continuer.';
                        }
                    }).then((result) => {
                        if (result.isConfirmed) {
                            sessionStorage.setItem('vcr_username', result.value);
                            setUserName(result.value);
                        }
                    });
                }
            }, []);

            useEffect(() => {
                if (!formData.status) setFormData(getDefaultFormData(type, sourceType));
            }, [type, sourceType, getDefaultFormData, formData.status]);

            useEffect(() => {
                setFormData(prev => ({
                    ...prev,
                    contact: sourceType === SourceType.FILE ? '1' : '0'
                }));
            }, [sourceType]);

            useEffect(() => {
                if (isModalOpen && textareaRef.current) {
                    setTimeout(() => { textareaRef.current?.focus(); }, 100);
                }
            }, [isModalOpen]);

            useEffect(() => {
                const newStatus = calculateStatus(formData, type, importedContactValue !== undefined);
                if (newStatus && newStatus !== formData.status) {
                    setFormData(prev => ({ ...prev, status: newStatus }));
                }
            }, [importedContactValue, type, calculateStatus]);

            const handleReset = async () => {
                const result = await Swal.fire({
                    title: 'Réinitialiser le formulaire ?',
                    text: "Toutes les données saisies ainsi que le 2ème contact seront effacés.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#64748b',
                    confirmButtonText: 'Oui, effacer',
                    cancelButtonText: 'Annuler'
                });
                if (result.isConfirmed) {
                    setFormData(getDefaultFormData(type, sourceType));
                    setImportedContactValue(undefined);
                    setImportedSignature('');
                    Swal.fire({ title: 'Effacé !', icon: 'success', timer: 800, showConfirmButton: false, toast: true, position: 'top-end' });
                }
            };

            const handleAnalysis = (text) => {
                setAnalysisInput(text);
                if (!text || !text.includes('[[')) return;
                
                let extractedSig = '';
                const oldSigMatch = text.match(/Par\s*:\s*([^\n\r]+)/i);
                if (oldSigMatch) {
                    extractedSig = oldSigMatch[1].trim();
                } else {
                    const newSigMatch = text.match(/C1\s*\(([^)]+)\)\s*:/i);
                    if (newSigMatch) extractedSig = newSigMatch[1].trim();
                }
                setImportedSignature(extractedSig);

                const regex = /\[\[(.*?)\]\]/s;
                const match = text.match(regex);
                if (!match) return;
                const content = match[1];
                const parts = content.split('\\');
                const newFormData = { ...formData };
                let detectedType = type;
                let importedContact = undefined;

                const typeValue = parts[0]?.trim();
                if (typeValue) {
                    if (typeValue === 'RACC') detectedType = AppType.RACC;
                    else if (typeValue === 'PLP') detectedType = AppType.PLP;
                    else if (typeValue === 'E2') detectedType = AppType.PLP_E2;
                    else if (typeValue === 'E3') detectedType = AppType.PLP_E3;
                    setType(detectedType);
                }
                
                const statusValue = parts[1]?.trim();
                if (statusValue) {
                    let s = statusValue;
                    if (s === 'NC OK') s = 'CONF';
                    else if (s === 'NC COR') s = 'COR PND';
                    else if (s === 'NC KO') s = 'NC';
                    newFormData.status = s;
                }

                const FIXED_SIGNATURE_ORDER_KEYS = [
                    'contact', 'presta', 'Val_ROP', 'desserte', 'pm_dechets', 'pm_cadrage', 'pm_ref_jarretieres', 'pm_mesure',
                    'pto_conf', 'pto_etiquette', 'pto_suspicion', 'pto_mesure_avant', 'pto_mesure', 'pto_photo', 'pto_cadrage',
                    'pbo_ref_cable', 'pbo_ref_pb', 'pbo_avant', 'pbo_apres', 'pbo_cadrage', 'pbo_mesure_e2',
                    'autre_penetration', 'autre_geoloc', 'autre_voisinage', 'autre_voisin_perturbe', 'autre_sauvage', 'autre_nacelle', 'autre_photo_poteau'
                ];

                parts.slice(2).forEach((part, idx) => {
                    const key = FIXED_SIGNATURE_ORDER_KEYS[idx];
                    if (!key) return;

                    let cleanValue = part.trim();
                    let comment = '';
                    if (cleanValue.includes('(')) {
                        const valMatch = cleanValue.match(/^(.*?)\s*\((.*?)\)$/);
                        if (valMatch) { cleanValue = valMatch[1].trim(); comment = valMatch[2].trim(); }
                    }

                    if (key === 'contact') {
                        importedContact = cleanValue === 'Avec' ? '1' : (cleanValue === 'Sans' ? '0' : cleanValue);
                        newFormData[key] = importedContact;
                        return;
                    }

                    let finalVal = cleanValue;
                    if (['presta', 'Val_ROP', 'desserte', 'autre_voisin_perturbe', 'autre_sauvage'].includes(key)) {
                        if (cleanValue === 'Cor') finalVal = 'Cor';
                        else finalVal = (cleanValue === 'Oui' || cleanValue === '1') ? '1' : '0';
                    } else {
                        if (cleanValue === 'Cor') finalVal = 'Cor';
                        else if (cleanValue === 'NET') finalVal = 'NET';
                        else if (cleanValue === '1') finalVal = '1';
                        else if (cleanValue === '0') finalVal = '0';
                        else if (cleanValue === 'NA') finalVal = 'NA';
                    }
                    
                    newFormData[key] = finalVal;
                    if (COMMENT_FIELDS_MAP[key]) newFormData[COMMENT_FIELDS_MAP[key]] = comment;
                });

                setImportedContactValue(importedContact);
                setFormData(newFormData);
                setIsModalOpen(false);
                setAnalysisInput('');

                        <DatalistInput isVisible={isFieldVisible('pbo_apres', type) && (formData.pbo_apres === '0' || formData.pbo_apres === 'Cor')} id="pbo_comm_apres" label="COMM PBO APRÈS" value={formData.pbo_comm_apres || ''} onChange={(v) => updateField('pbo_comm_apres', v)} options={OPTIONS.pbApresOpts} />
                        {isFieldVisible('pbo_cadrage', type) && <ToggleGroup id="pbo_cadrage" label="CADRAGE PB" value={formData.pbo_cadrage} onChange={(v) => updateField('pbo_cadrage', v)} hasCor description={DESCRIPTIONS.pbo_cadrage} />}
                        {isFieldVisible('pbo_mesure_e2', type) && <ToggleGroup id="pbo_mesure_e2" label="MESURE E2" isTriState={type !== AppType.PLP_E2} value={formData.pbo_mesure_e2} onChange={(v) => updateField('pbo_mesure_e2', v)} hasCor description={DESCRIPTIONS.pbo_mesure_e2} />}
                        </Section>

                        <Section 
                        id="autre"
                        title="5. AUTRE" 
                        icon={<AutreIcon />} 
                        isVisible={isBlockVisible(['autre_penetration', 'autre_geoloc', 'autre_voisinage', 'autre_voisin_perturbe', 'autre_sauvage', 'autre_nacelle', 'autre_photo_poteau'])} 
                        baseColor="purple"
                        isActive={activeSection === 'autre'}
                        onActivate={() => setActiveSection('autre')}
                        >
                        {isFieldVisible('autre_penetration', type) && <ToggleGroup id="autre_penetration" label="PÉNÉTRATION" value={formData.autre_penetration} onChange={(v) => updateField('autre_penetration', v)} hasCor description={DESCRIPTIONS.autre_penetration} />}
                        {isFieldVisible('autre_geoloc', type) && <ToggleGroup id="autre_geoloc" label="GÉOLOCALISATION" value={formData.autre_geoloc} onChange={(v) => updateField('autre_geoloc', v)} hasCor description={DESCRIPTIONS.autre_geoloc} />}
                        {isFieldVisible('autre_voisinage', type) && <ToggleGroup id="autre_voisinage" label="CHECKVOISINAGE" value={formData.autre_voisinage} onChange={(v) => updateField('autre_voisinage', v)} hasCor description={DESCRIPTIONS.autre_voisinage} />}
                        <DatalistInput isVisible={isFieldVisible('autre_voisinage', type) && (formData.autre_voisinage === '0' || formData.autre_voisinage === 'Cor')} id="autre_comm_voisinage" label="COMM. CHECKV." value={formData.autre_comm_voisinage || ''} onChange={(v) => updateField('autre_comm_voisinage', v)} options={OPTIONS.voisinageOpts} />
                        {isFieldVisible('autre_voisin_perturbe', type) && <ToggleGroup id="autre_voisin_perturbe" label="VOISIN PERTURBÉ" value={formData.autre_voisin_perturbe} onChange={(v) => updateField('autre_voisin_perturbe', v)} options={[{label: 'Non', value: '0'}, {label: 'Oui', value: '1'}]} colorReversed={true} hasCor description={DESCRIPTIONS.autre_voisin_perturbe} />}
                        {isFieldVisible('autre_sauvage', type) && <ToggleGroup id="autre_sauvage" label="INC" value={formData.autre_sauvage} onChange={(v) => updateField('autre_sauvage', v)} options={[{label: 'Non', value: '0'}, {label: 'Oui', value: '1'}]} colorReversed={true} hasCor description={DESCRIPTIONS.autre_sauvage} />}
                        {isFieldVisible('autre_nacelle', type) && <ToggleGroup id="autre_nacelle" label="NACELLE" isTriState value={formData.autre_nacelle} onChange={(v) => updateField('autre_nacelle', v)} hasCor description={DESCRIPTIONS.autre_nacelle} />}
                        {isFieldVisible('autre_photo_poteau', type) && <ToggleGroup id="autre_photo_poteau" label="POTEAU" isTriState value={formData.autre_photo_poteau} onChange={(v) => updateField('autre_photo_poteau', v)} hasCor />}
                        </Section>
                    </div>
                    </div>
                    <div className="w-full md:w-[300px] xl:w-[340px] shrink-0 flex flex-col min-h-0">
                    <div className="form-section !rounded-xl p-2 flex flex-col h-full overflow-hidden border-t-4 border-t-slate-800">
                        <h3 className="flex items-center justify-center gap-2 font-black text-[10px] uppercase tracking-widest mb-1.5 pb-1 border-b text-slate-800"><SynthesisIcon /> SYNTHÈSE</h3>
                        <textarea 
                        readOnly 
                        value={synthesisText} 
                        placeholder="En attente..." 
                        className="flex-1 w-full bg-slate-50/60 rounded-lg p-2 text-[9px] fira-code resize-none shadow-inner focus:outline-none transition-all mb-1.5 custom-scroll min-h-0 select-none no-select"
                        style={{ userSelect: 'none', pointerEvents: 'none' }}
                        />
                        
                        <div className="mb-1.5 shrink-0">
                        <label className="text-[0.7rem] font-[800] uppercase tracking-[0.05em] leading-[1.3] text-[#64748b] mb-1.5 block text-center">STATUT VALIDATION</label>
                        <div className="grid grid-cols-2 gap-1 px-1">
                            {['CONF', 'COR PND', 'COR APR', 'NC'].map((status) => {
                            const isActive = formData.status === status;
                            let pillStyle = "border-2 border-slate-200 text-slate-400 bg-white";
                            if (isActive) {
                                if (status === 'CONF') pillStyle = "border-2 border-emerald-500 text-emerald-600 bg-emerald-50 shadow-md scale-105";
                                else if (status === 'COR PND') pillStyle = "border-2 border-amber-500 text-amber-600 bg-amber-50 shadow-md scale-105";
                                else if (status === 'COR APR') pillStyle = "border-2 border-blue-500 text-blue-600 bg-blue-50 shadow-md scale-105";
                                else if (status === 'NC') pillStyle = "border-2 border-red-500 text-red-600 bg-red-50 shadow-md scale-105";
                            }
                            return (
                                <label key={status} className="cursor-pointer">
                                <input type="radio" name="validation_status" className="hidden" checked={isActive} onChange={() => updateField('status', status)} />
                                <span className={`flex items-center justify-center py-2 rounded-xl text-[8px] font-black uppercase transition-all duration-300 ${pillStyle}`}>{status}</span>
                                </label>
                            );
                            })}
                        </div>
                        </div>
                        <div className="flex gap-1.5 shrink-0 mt-2">
                        <button 
                            onClick={() => { if (isFormComplete) { navigator.clipboard.writeText(synthesisText); Swal.fire({ icon: 'success', title: 'Copié !', timer: 1000, showConfirmButton: false, toast: true, position: 'top-end' }); } }} 
                            disabled={!isFormComplete} 
                            className="flex-1 flex items-center justify-center gap-2 py-3 rounded-lg font-black text-[10px] uppercase text-white btn-copy"
                        >
                            <CopyIcon /> COPIER
                        </button>
                        <button onClick={handleReset} className="flex items-center justify-center gap-2 px-4 py-3 rounded-lg text-white bg-red-600 shadow-sm active:scale-95 hover:bg-red-700 transition-colors"><ResetIcon /></button>
                        </div>
                    </div>
                    </div>
                </main>
                <footer className="bg-black/10 py-1 text-center text-[7px] font-black uppercase tracking-[0.4em] shrink-0 border-t border-white/5 opacity-30">VCR OK v4.0</footer>
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
