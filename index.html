<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCR OK - Professional Fiber Validation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --app-bg: #f1f5f9;
      --app-accent: #64748b;
      --app-header-bg: #334155;
      --app-card-bg: #ffffff;
      --app-card-border: #e2e8f0;
      --app-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    body { font-family: 'Inter', sans-serif; background: var(--app-bg); height: 100vh; width: 100vw; overflow: hidden; margin: 0; padding: 0; }
    .form-section { background: #ffffff; color: #1e293b; border-radius: 0.75rem; border: 2px solid transparent; border-top: 4px solid var(--app-card-border); padding: 0.5rem; box-shadow: var(--app-shadow); display: flex; flex-direction: column; gap: 0.1rem; position: relative; }
    .section-title { color: var(--app-accent) !important; border-bottom: 2px solid #f1f5f9; }
    nav { background-color: var(--app-header-bg) !important; }
    .tooltip-trigger:hover .tooltip-box { opacity: 1; visibility: visible; }
    .tooltip-box { opacity: 0; visibility: hidden; pointer-events: none; z-index: 9999; width: max-content; max-width: 300px; min-width: 180px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2); font-weight: 600; line-height: 1.3; white-space: normal; background: #1e293b; color: white; padding: 6px 10px; border-radius: 8px; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--app-accent); border-radius: 10px; opacity: 0.3; }
    .custom-scroll { scrollbar-width: thin; scrollbar-color: var(--app-accent) transparent; }
    .fira-code { font-family: 'Fira Code', monospace; }
    .btn-copy { background: #ffffff; color: #2563eb; border: 2px solid #3b82f6; box-shadow: 0 1px 3px rgba(37, 99, 235, 0.1); transition: all 0.15s ease-in-out; }
    .btn-copy:hover:not(:disabled) { background: #eff6ff; color: #1d4ed8; border-color: #2563eb; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); transform: translateY(-1px); }
    .btn-copy:active:not(:disabled) { transform: translateY(0); background: #dbeafe; }
    .btn-copy:disabled { background: #f1f5f9; color: #94a3b8; border-color: #e2e8f0; cursor: not-allowed; box-shadow: none; }
  </style>
</head>
<body class="bg-gray-100 h-screen w-screen m-0 p-0 overflow-hidden">
  <div id="root" class="h-full w-full"></div>
  <script>
    (() => {
        // --- CONSTANTS ---
        const AppType = { RACC: 'RACC', PLP: 'PLP', PLP_E2: 'PLP_E2', PLP_E3: 'PLP_E3' };
        const SourceType = { FILE: 'FILE', STOCK: 'STOCK' };
        const TYPE_LABELS = { RACC: 'RACCORDEMENT', PLP: 'PLP', PLP_E2: 'PLP E2', PLP_E3: 'PLP E3' };
        const OUI_NON_OPTS = [{ label: 'Oui', value: '1' }, { label: 'Non', value: '0' }];
        
        const DESCRIPTIONS = {
            contact: "Avec = Appel entrant / Sans = Stock ou BL", presta: "Typologie RDV terrain différente du dossier", Val_ROP: "Validation ROP faite (OI ou eMutation)", desserte: "Type PBO dossier différent du terrain",
            pm_dechets: "Déchets sur les images PM", pm_cadrage: "Photo PM complète", pm_ref_jarretieres: "Référence jarretière conforme", pm_mesure: "Mesure PM sur 1490/1577",
            pto_conf: "PTO de BYTEL", pto_etiquette: "Référence PTO conforme/imprimée", pto_suspicion: "Doute fraude PTO", pto_mesure_avant: "Mesure PTO avant intervention (E2)", pto_photo: "Photo PTO globale", pto_mesure: "Mesure PTO conforme", pto_cadrage: "Cadrage correct PTO",
            pbo_ref_cable: "Réf câble client sur PBO", pbo_ref_pb: "Réf PBO conforme", pbo_avant: "Photo PBO Avant", pbo_apres: "Photo PBO Après", pbo_cadrage: "PBO bien cadré", pbo_mesure_e2: "Mesure PBO (E2)",
            autre_penetration: "Point de pénétration", autre_geoloc: "Photos géolocalisées", autre_voisinage: "CheckVoisinage conforme", autre_voisin_perturbe: "Voisin perturbé", autre_sauvage: "Incohérence ROP", autre_nacelle: "Nacelle utilisée"
        };
        const OPTIONS = {
            commDechets: ["Avant", "Après", "Complexe"], commEtiquette: ["Erronée", "Illisible", "Absente", "Manuscrite"], commJarretieres: ["Illisible", "Manuscrite", "Erronée", "Absente"],
            commCable: ["Illisible", "Manuscrite", "Erronée", "Absente", "Non gravée"], commRefPb: ["Illisible", "Erronée", "Absente"], commFibre: ["Erronée", "Illisible", "Absente"],
            commPhotoPtoPlp: ["Jarretière pas complètement visible", "PTO non entière", "PTO non fixée", "Photomètre non présent", "Photomètre non réglé sur 1490 ou 1577", "Mesure NC"],
            suspicionOpts: ["Pto non fixée", "Photo avant travaux absente", "NC (si PLP > RACC)", "Jarr illisible complètement"], pbAvantOpts: ["Absente", "Cassette différente"], pbApresOpts: ["Absente", "Illisible", "Erronée"],
            voisinageOpts: ["KO", "Perte puissante", "Absent", "NC"], mesureExtra: ["Illisible", "Photomètre non réglé sur 1490 ou 1577", "Absente"]
        };
        const getPlaceholder = (text, isOk) => `https://placehold.co/600x400/${isOk ? 'dcfce7/166534' : 'fee2e2/991b1b'}?text=${encodeURIComponent(text)}`;
        const VISUAL_GUIDES = [
            { id: 'pto_conf', title: 'PTO CONFORME', description: DESCRIPTIONS.pto_conf, cases: [{ label: 'CONFORME (BYTEL)', status: 'ok', imageUrl: getPlaceholder('PTO BYTEL OK', true) }, { label: 'NON CONFORME', status: 'ko', imageUrl: getPlaceholder('PTO ALIEN KO', false) }] },
            { id: 'pbo_ref_cable', title: 'RÉF CABLE PBO', description: DESCRIPTIONS.pbo_ref_cable, cases: [{ label: 'GRAVÉE / ÉTIQUETTE PRO', status: 'ok', imageUrl: getPlaceholder('REF OK', true) }, { label: 'MANUSCRITE/ABSENTE', status: 'ko', imageUrl: getPlaceholder('MANUSCRITE/ABS', false) }] },
            { id: 'pto_etiquette', title: 'ÉTIQUETTE PTO', description: DESCRIPTIONS.pto_etiquette, cases: [{ label: 'IMPRIMÉE & COLLÉE', status: 'ok', imageUrl: getPlaceholder('ETIQ OK', true) }, { label: 'MANUSCRITE/ABSENTE', status: 'ko', imageUrl: getPlaceholder('ABSENTE', false) }] },
            { id: 'pm_ref_jarretieres', title: 'RÉF JARRETIÈRE PM', description: DESCRIPTIONS.pm_ref_jarretieres, cases: [{ label: 'VISIBLE', status: 'ok', imageUrl: getPlaceholder('ETIQ OK', true) }, { label: 'ABSENTE', status: 'ko', imageUrl: getPlaceholder('ABSENTE', false) }] },
            { id: 'pm_dechets', title: 'DÉCHETS PM', description: DESCRIPTIONS.pm_dechets, cases: [{ label: 'PROPRE', status: 'ok', imageUrl: getPlaceholder('PROPRE', true) }, { label: 'DÉCHETS', status: 'ko', imageUrl: getPlaceholder('DÉCHETS', false) }] }
        ];

        const FIXED_SIGNATURE_ORDER = [
            { key: 'contact', label: 'CONTACT' }, { key: 'presta', label: 'CHGT PRESTA' }, { key: 'Val_ROP', label: 'VALIDATION ROP' }, { key: 'desserte', label: 'CHGT DESSERTE' },
            { key: 'pm_dechets', label: 'DÉCHETS PM' }, { key: 'pm_cadrage', label: 'CADRAGE PM' }, { key: 'pm_ref_jarretieres', label: 'RÉF JARR.' }, { key: 'pm_mesure', label: 'MESURE PM' },
            { key: 'pto_conf', label: 'PTO CONFORME' }, { key: 'pto_etiquette', label: 'ÉTIQUETTE PTO' }, { key: 'pto_suspicion', label: 'SUSPICION FRAUDE' }, { key: 'pto_mesure_avant', label: 'MESURE PTO AVANT' }, { key: 'pto_mesure', label: 'MESURE PTO' }, { key: 'pto_photo', label: 'PHOTO PTO' }, { key: 'pto_cadrage', label: 'CADRAGE PTO' },
            { key: 'pbo_ref_cable', label: 'RÉF CABLE' }, { key: 'pbo_ref_pb', label: 'RÉF PB' }, { key: 'pbo_avant', label: 'PHOTO PBO AVANT' }, { key: 'pbo_apres', label: 'PHOTO PBO APRÈS' }, { key: 'pbo_cadrage', label: 'CADRAGE PB' }, { key: 'pbo_mesure_e2', label: 'MESURE E2' },
            { key: 'autre_penetration', label: 'PÉNÉTRATION' }, { key: 'autre_geoloc', label: 'GÉOLOCALISATION' }, { key: 'autre_voisinage', label: 'CHECKVOISINAGE' }, { key: 'autre_voisin_perturbe', label: 'VOISIN PERTURBÉ' }, { key: 'autre_sauvage', label: 'INC' }, { key: 'autre_nacelle', label: 'NACELLE' }, { key: 'autre_photo_poteau', label: 'POTEAU' }
        ];
        const SIGNATURE_COMMENT_MAP = {
            'pm_dechets': 'pm_comm_dechets', 'pm_ref_jarretieres': 'pm_comm_jarretieres', 'pm_mesure': 'pm_mesure_extra', 'pto_etiquette': 'pto_comm_etiquette', 'pto_suspicion': 'pto_comm_suspicion',
            'pto_mesure': 'pto_mesure_extra', 'pto_photo': 'pto_comm_photo', 'pbo_ref_cable': 'pbo_comm_cable', 'pbo_ref_pb': 'pbo_comm_pb', 'pbo_avant': 'pbo_comm_avant', 'pbo_apres': 'pbo_comm_apres', 'autre_voisinage': 'autre_comm_voisinage'
        };

        const formatUserSignature = (f) => { if(!f||!f.trim())return"";const p=f.trim().split(/\s+/);if(p.length===0)return"";const n=p[0],l=p.length>1?p.slice(1).join(""):n.length>2?n.substring(2,5):"";return`${n.substring(0,2).charAt(0).toUpperCase()}${n.length>1?n.substring(1,2).toLowerCase():""}.${l.substring(0,3).toUpperCase()}`};

        const generateSynthesis = (type, data, impC, uName, impSig) => {
            const f = (id) => data[id] || 'NA';
            const parts = [(type===AppType.RACC?'RACC':type===AppType.PLP_E3?'E3':type===AppType.PLP_E2?'E2':'PLP'), data['status']||'CONF'];
            FIXED_SIGNATURE_ORDER.forEach(i => {
                const k=i.key, v=f(k);
                let dV = v==='NA'?'NA':(v==='Cor'?'Cor':(v==='1'?'1':'0'));
                if(k==='contact') dV = v==='NA'?'NA':(v==='1'?'Avec':'Sans');
                else if(['presta','Val_ROP','desserte','autre_voisin_perturbe','autre_sauvage'].includes(k)) dV=v==='Cor'?'Cor':(v==='NA'?'NA':(v==='1'?'Oui':'Non'));
                const cK = SIGNATURE_COMMENT_MAP[k], c = cK?data[cK]:null;
                if(c&&c.trim()!==''&&(v==='0'||v==='Cor')) dV+=` (${c.trim()})`;
                parts.push(dV);
            });
            const typeT = type===AppType.RACC?'RACCORDEMENT':type===AppType.PLP_E3?'PLP E3':type===AppType.PLP_E2?'PLP E2':'PLP';
            const cL = data['contact']==='1'?'Avec':'Sans', sig = uName?formatUserSignature(uName):'';
            let cLine = impC ? `C1${impSig?` (${impSig})`:''} : ${impC==='1'?'Avec':(impC==='0'?'Sans':impC)} / C2${sig?` (${sig})`:''} : ${cL}` : `C1${sig?` (${sig})`:''} : ${cL}`;
            let out = `*** CR ${typeT} ***\n${cLine}\n${data['status']||'CONF'}\n`;
            
            const ln = (lbl,id,fmt='tri',cid) => {
                const v=f(id); if(v==='NA')return"";
                let dv=v;
                if(v==='Cor')dv='Cor'; else if(fmt==='contact')dv=v==='1'?'Avec':'Sans'; else if(fmt==='ouinon'||fmt==='voisin')dv=v==='1'?'Oui':'Non'; else dv=v==='1'?'1':'0';
                const cm=cid?data[cid]:null; return `${lbl} : ${dv}${cm&&cm.trim()!==''?` (${cm.trim()})`:''}\n`;
            };
            
            let gC="";gC+=ln('CONTACT','contact','contact');gC+=ln('Chgt Presta','presta','ouinon');gC+=ln('Validation ROP','Val_ROP','ouinon');gC+=ln('Chgt Desserte','desserte','ouinon'); if(gC)out+=gC;
            let pmC="";pmC+=ln('Déchets PM','pm_dechets','tri','pm_comm_dechets');if(f('pm_cadrage')!=='1')pmC+=ln('Cadrage PM','pm_cadrage');if(f('pm_ref_jarretieres')!=='1')pmC+=ln('Réf JARR.','pm_ref_jarretieres','tri','pm_comm_jarretieres');if(f('pm_mesure')!=='1')pmC+=ln('Mesure PM','pm_mesure','tri','pm_mesure_extra');if(pmC)out+=`------------------------- PM -------------------------\n${pmC}`;
            let ptC="";if(f('pto_conf')!=='1')ptC+=ln('PTO Conforme','pto_conf');if(f('pto_etiquette')!=='1')ptC+=ln('Étiquette PTO','pto_etiquette','tri','pto_comm_etiquette');if(f('pto_suspicion')!=='1')ptC+=ln('Suspicion fraude','pto_suspicion','tri','pto_comm_suspicion');if(f('pto_mesure_avant')!=='1')ptC+=ln('Mesure PTO avant','pto_mesure_avant');if(f('pto_mesure')!=='1')ptC+=ln('Mesure PTO','pto_mesure','tri','pto_mesure_extra');if(f('pto_photo')!=='1')ptC+=ln('Photo PTO','pto_photo','tri','pto_comm_photo');if(f('pto_cadrage')!=='1')ptC+=ln('Cadrage PTO','pto_cadrage');if(ptC)out+=`------------------------- PTO -------------------------\n${ptC}`;
            let pbC="";if(f('pbo_ref_cable')!=='1')pbC+=ln('Réf Cable','pbo_ref_cable','tri','pbo_comm_cable');if(f('pbo_ref_pb')!=='1')pbC+=ln('Réf PB','pbo_ref_pb','tri','pbo_comm_pb');if(f('pbo_avant')!=='1')pbC+=ln('Photo PBO avant','pbo_avant','tri','pbo_comm_avant');if(f('pbo_apres')!=='1')pbC+=ln('Photo PBO après','pbo_apres','tri','pbo_comm_apres');if(f('pbo_cadrage')!=='1')pbC+=ln('Cadrage PB','pbo_cadrage');if(f('pbo_mesure_e2')!=='1')pbC+=ln('Mesure E2','pbo_mesure_e2');if(pbC)out+=`------------------------- PBO -------------------------\n${pbC}`;
            let aC="";if(f('autre_penetration')!=='1')aC+=ln('Pénétration','autre_penetration');if(f('autre_geoloc')!=='1')aC+=ln('Géolocalisation','autre_geoloc');if(f('autre_voisinage')!=='1')aC+=ln('CheckVoisinage','autre_voisinage','tri','autre_comm_voisinage');if(f('autre_voisin_perturbe')!=='0')aC+=ln('Voisin Perturbé','autre_voisin_perturbe','voisin');if(f('autre_sauvage')!=='0')aC+=ln('INC','autre_sauvage','ouinon');if(f('autre_nacelle')!=='1')aC+=ln('Nacelle','autre_nacelle');if(f('autre_photo_poteau')!=='1')aC+=ln('Poteau','autre_photo_poteau');if(aC)out+=`------------------------- AUTRE -------------------------\n${aC}`;
            
            return `[[${parts.join('\\')}]]\n${out.trim()}`.replace(/\n{3,}/g, '\n\n');
        };

        // --- STATE & UTILS ---
        let state = { userName: '', type: AppType.RACC, sourceType: SourceType.FILE, formData: { status: '' }, analysisInput: '', isModalOpen: false, isDocOpen: false, docTab: 'visual', importedContactValue: undefined, importedSignature: '', activeSection: 'general' };
        
        const ALL_KEYS = ['contact','presta','Val_ROP','desserte','pm_dechets','pm_comm_dechets','pm_cadrage','pm_ref_jarretieres','pm_mesure','pto_conf','pto_etiquette','pto_suspicion','pto_mesure_avant','pto_mesure','pto_photo','pto_cadrage','pbo_ref_cable','pbo_ref_pb','pbo_avant','pbo_apres','pbo_cadrage','pbo_mesure_e2','autre_penetration','autre_geoloc','autre_voisinage','autre_voisin_perturbe','autre_sauvage','autre_nacelle','autre_photo_poteau'];
        const KEY_TO_HUMAN_LABEL = { 'contact':'CONTACT','presta':'CHGT PRESTA','Val_ROP':'VALIDATION ROP','desserte':'CHGT DESSERTE','pm_dechets':'DÉCHETS PM','pm_comm_dechets':'COMM DÉCHETS PM','pm_cadrage':'CADRAGE PM','pm_ref_jarretieres':'RÉF JARR.','pm_comm_jarretieres':'COMM JARR.','pm_mesure':'MESURE PM','pm_mesure_extra':'DÉTAIL MESURE PM','pto_conf':'PTO CONFORME','pto_etiquette':'ÉTIQUETTE PTO','pto_comm_etiquette':'COMM ETIQ. PTO','pto_suspicion':'SUSPICION FRAUDE','pto_comm_suspicion':'DÉTAIL SUSPICION','pto_mesure_avant':'MESURE PTO AVANT','pto_mesure':'MESURE PTO','pto_mesure_extra':'DÉTAIL MESURE PTO','pto_photo':'PHOTO PTO','pto_comm_photo':'COMM PHOTO PTO','pto_cadrage':'CADRAGE PTO','pbo_ref_cable':'RÉF CABLE','pbo_comm_cable':'COMM CABLE','pbo_ref_pb':'RÉF PB','pbo_comm_pb':'COMM RÉF PB','pbo_avant':'PHOTO PBO AVANT','pbo_comm_avant':'COMM PBO AVANT','pbo_apres':'PHOTO PBO APRÈS','pbo_comm_apres':'COMM PBO APRÈS','pbo_cadrage':'CADRAGE PB','pbo_mesure_e2':'MESURE E2','autre_penetration':'PÉNÉTRATION','autre_geoloc':'GÉOLOCALISATION','autre_voisinage':'CHECKVOISINAGE','autre_comm_voisinage':'COMM. CHECKV.','autre_voisin_perturbe':'VOISIN PERTURBÉ','autre_sauvage':'INC','autre_nacelle':'NACELLE','autre_photo_poteau':'POTEAU' };
        
        const isFieldVisible = (id, t) => {
            if(id==='pto_mesure_avant'||id==='pbo_mesure_e2') return t===AppType.PLP_E2;
            if(['pto_photo','pto_comm_photo'].includes(id)) return t===AppType.PLP;
            if(t===AppType.RACC||t===AppType.PLP_E2) return true;
            if(t===AppType.PLP) return ['pto_etiquette','pto_mesure','pm_dechets','pm_comm_dechets','pm_mesure','autre_voisinage'].includes(id);
            if(t===AppType.PLP_E3) return !['pbo_ref_cable','pbo_ref_pb','pbo_avant','pbo_apres','pbo_cadrage','pbo_mesure_e2','autre_nacelle','autre_photo_poteau'].includes(id);
            return true;
        };
        const isBlockVisible = (ids) => ids.some(id => isFieldVisible(id, state.type));
        
        const calculateStatus = (d, t, imp) => {
            const tech = ALL_KEYS.filter(k => isFieldVisible(k, t) && !k.includes('_comm_') && !k.includes('_extra') && !['contact','presta','Val_ROP','desserte'].includes(k));
            let ko=false, cor=false;
            for(const k of tech) { const v=d[k]; if(v==='Cor')cor=true; else if(['autre_voisin_perturbe','autre_sauvage'].includes(k)){if(v==='1')ko=true;} else {if(v==='0')ko=true;} }
            return ko?'NC':(cor?(imp?'COR APR':'COR PND'):'CONF');
        };

        const getDefaultFormData = (t, s) => {
            const d = { status: '' };
            ALL_KEYS.forEach(k => {
                if(isFieldVisible(k, t)) {
                    if(k==='pm_comm_dechets') d[k]=''; else if(k==='contact') d[k]=s===SourceType.FILE?'1':'0';
                    else if((k==='pto_mesure_avant'||k==='pbo_mesure_e2')&&t===AppType.PLP_E2) d[k]='1';
                    else if(['pbo_mesure_e2','autre_nacelle','autre_photo_poteau'].includes(k)) d[k]='NA';
                    else if(['presta','Val_ROP','desserte','autre_voisin_perturbe','autre_sauvage'].includes(k)) d[k]='0';
                    else d[k]='1';
                } else d[k]='NA';
            });
            d.status = calculateStatus(d, t, false) || 'CONF'; return d;
        };

        // --- ICONS ---
        const Icon = (p) => `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${p}"/></svg>`;
        const GeneralIcon = () => Icon("M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2");
        const PMIcon = () => Icon("M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01");
        const PTOIcon = () => Icon("M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z");
        const PBOIcon = () => Icon("M13 10V3L4 14h7v7l9-11h-7z");
        const AutreIcon = () => Icon("M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4");
        const SynthesisIcon = () => Icon("M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z");
        const CopyIcon = () => `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
        const ResetIcon = () => `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>`;

        // --- COMPONENTS ---

            ${isFieldVisible('pbo_ref_cable',state.type)?ToggleGroup({id:"pbo_ref_cable",label:"RÉF CABLE",value:state.formData.pbo_ref_cable,hasCor:true,description:DESCRIPTIONS.pbo_ref_cable}):''}
            ${DatalistInput({id:"pbo_comm_cable",label:"COMM CABLE",value:state.formData.pbo_comm_cable||'',options:OPTIONS.commCable,isVisible:isFieldVisible('pbo_ref_cable',state.type)&&(state.formData.pbo_ref_cable==='0'||state.formData.pbo_ref_cable==='Cor')})}
            ${isFieldVisible('pbo_ref_pb',state.type)?ToggleGroup({id:"pbo_ref_pb",label:"RÉF PB",value:state.formData.pbo_ref_pb,hasCor:true,description:DESCRIPTIONS.pbo_ref_pb}):''}
            ${DatalistInput({id:"pbo_comm_pb",label:"COMM RÉF",value:state.formData.pbo_comm_pb||'',options:OPTIONS.commRefPb,isVisible:isFieldVisible('pbo_ref_pb',state.type)&&(state.formData.pbo_ref_pb==='0'||state.formData.pbo_ref_pb==='Cor')})}
            ${isFieldVisible('pbo_avant',state.type)?ToggleGroup({id:"pbo_avant",label:"PHOTO PBO AVANT",value:state.formData.pbo_avant,hasCor:true,description:DESCRIPTIONS.pbo_avant}):''}
            ${DatalistInput({id:"pbo_comm_avant",label:"COMM PBO AVANT",value:state.formData.pbo_comm_avant||'',options:OPTIONS.pbAvantOpts,isVisible:isFieldVisible('pbo_avant',state.type)&&(state.formData.pbo_avant==='0'||state.formData.pbo_avant==='Cor')})}
            ${isFieldVisible('pbo_apres',state.type)?ToggleGroup({id:"pbo_apres",label:"PHOTO PBO APRÈS",value:state.formData.pbo_apres,hasCor:true,description:DESCRIPTIONS.pbo_apres}):''}
            ${DatalistInput({id:"pbo_comm_apres",label:"COMM PBO APRÈS",value:state.formData.pbo_comm_apres||'',options:OPTIONS.pbApresOpts,isVisible:isFieldVisible('pbo_apres',state.type)&&(state.formData.pbo_apres==='0'||state.formData.pbo_apres==='Cor')})}
            ${isFieldVisible('pbo_cadrage',state.type)?ToggleGroup({id:"pbo_cadrage",label:"CADRAGE PB",value:state.formData.pbo_cadrage,hasCor:true,description:DESCRIPTIONS.pbo_cadrage}):''}
            ${isFieldVisible('pbo_mesure_e2',state.type)?ToggleGroup({id:"pbo_mesure_e2",label:"MESURE E2",isTriState:state.type!==AppType.PLP_E2,value:state.formData.pbo_mesure_e2,hasCor:true,description:DESCRIPTIONS.pbo_mesure_e2}):''}
          `})}
          ${Section({ id:"autre", title:"5. AUTRE", icon:AutreIcon(), isVisible:isBlockVisible(['autre_penetration','autre_geoloc','autre_voisinage','autre_voisin_perturbe','autre_sauvage','autre_nacelle','autre_photo_poteau']), baseColor:"purple", isActive:state.activeSection==='autre', children:`
            ${isFieldVisible('autre_penetration',state.type)?ToggleGroup({id:"autre_penetration",label:"PÉNÉTRATION",value:state.formData.autre_penetration,hasCor:true,description:DESCRIPTIONS.autre_penetration}):''}
            ${isFieldVisible('autre_geoloc',state.type)?ToggleGroup({id:"autre_geoloc",label:"GÉOLOCALISATION",value:state.formData.autre_geoloc,hasCor:true,description:DESCRIPTIONS.autre_geoloc}):''}
            ${isFieldVisible('autre_voisinage',state.type)?ToggleGroup({id:"autre_voisinage",label:"CHECKVOISINAGE",value:state.formData.autre_voisinage,hasCor:true,description:DESCRIPTIONS.autre_voisinage}):''}
            ${DatalistInput({id:"autre_comm_voisinage",label:"COMM. CHECKV.",value:state.formData.autre_comm_voisinage||'',options:OPTIONS.voisinageOpts,isVisible:isFieldVisible('autre_voisinage',state.type)&&(state.formData.autre_voisinage==='0'||state.formData.autre_voisinage==='Cor')})}
            ${isFieldVisible('autre_voisin_perturbe',state.type)?ToggleGroup({id:"autre_voisin_perturbe",label:"VOISIN PERTURBÉ",value:state.formData.autre_voisin_perturbe,options:[{label:'Non',value:'0'},{label:'Oui',value:'1'}],colorReversed:true,hasCor:true,description:DESCRIPTIONS.autre_voisin_perturbe}):''}
            ${isFieldVisible('autre_sauvage',state.type)?ToggleGroup({id:"autre_sauvage",label:"INC",value:state.formData.autre_sauvage,options:[{label:'Non',value:'0'},{label:'Oui',value:'1'}],colorReversed:true,hasCor:true,description:DESCRIPTIONS.autre_sauvage}):''}
            ${isFieldVisible('autre_nacelle',state.type)?ToggleGroup({id:"autre_nacelle",label:"NACELLE",isTriState:true,value:state.formData.autre_nacelle,hasCor:true,description:DESCRIPTIONS.autre_nacelle}):''}
            ${isFieldVisible('autre_photo_poteau',state.type)?ToggleGroup({id:"autre_photo_poteau",label:"POTEAU",isTriState:true,value:state.formData.autre_photo_poteau,hasCor:true}):''}
          `})}
        </div></div>
        
        <div class="w-full md:w-[300px] xl:w-[340px] shrink-0 flex flex-col min-h-0">
          <div class="form-section !rounded-xl p-2 flex flex-col h-full overflow-hidden border-t-4 border-t-slate-800">
            <h3 class="flex items-center justify-center gap-2 font-black text-[10px] uppercase tracking-widest mb-1.5 pb-1 border-b text-slate-800">${SynthesisIcon()} SYNTHÈSE</h3>
            <textarea id="synthesis-output" readonly placeholder="En attente..." class="flex-1 w-full bg-slate-50/60 rounded-lg p-2 text-[9px] fira-code resize-none shadow-inner focus:outline-none transition-all mb-1.5 custom-scroll min-h-0 select-none" style="user-select: none; pointer-events: none;">${synthesisText}</textarea>
            <div class="mb-1.5 shrink-0"><label class="text-[0.7rem] font-[800] uppercase tracking-[0.05em] leading-[1.3] text-[#64748b] mb-1.5 block text-center">STATUT VALIDATION</label>
              <div class="grid grid-cols-2 gap-1 px-1">${['CONF','COR PND','COR APR','NC'].map(s => {
                  const a=state.formData.status===s;
                  let p="border-2 border-slate-200 text-slate-400 bg-white";
                  if(a){if(s==='CONF')p="border-2 border-emerald-500 text-emerald-600 bg-emerald-50 shadow-md scale-105";else if(s==='COR PND')p="border-2 border-amber-500 text-amber-600 bg-amber-50 shadow-md scale-105";else if(s==='COR APR')p="border-2 border-blue-500 text-blue-600 bg-blue-50 shadow-md scale-105";else p="border-2 border-red-500 text-red-600 bg-red-50 shadow-md scale-105";}
                  return `<label class="cursor-pointer" onclick="window.app.updateField('status','${s}')"><input type="radio" name="validation_status" class="hidden" ${a?'checked':''}/><span class="flex items-center justify-center py-2 rounded-xl text-[8px] font-black uppercase transition-all duration-300 ${p}">${s}</span></label>`;
              }).join('')}</div>
            </div>
            <div class="flex gap-1.5 shrink-0 mt-2"><button onclick="window.app.copyToClipboard()" ${!isFormComplete?'disabled':''} class="flex-1 flex items-center justify-center gap-2 py-3 rounded-lg font-black text-[10px] uppercase btn-copy">${CopyIcon()} COPIER</button><button onclick="window.app.handleReset()" class="flex items-center justify-center gap-2 px-4 py-3 rounded-lg text-white bg-red-600 shadow-sm active:scale-95 hover:bg-red-700 transition-colors">${ResetIcon()}</button></div>
          </div>
        </div>
      </main>
      <footer class="bg-black/10 py-1 text-center text-[7px] font-black uppercase tracking-[0.4em] shrink-0 border-t border-white/5 opacity-30">VCR OK v4.0</footer>
    </div>`;
                if(activeId) { const el=document.getElementById(activeId); if(el){el.focus();if(selStart!==null&&selEnd!==null)el.setSelectionRange(selStart,selEnd);} }
                if(state.isModalOpen) setTimeout(() => document.getElementById('import-textarea')?.focus(), 100);
            }
        }

        window.app = {
            setType: (t) => { state.type=t; state.formData=getDefaultFormData(t,state.sourceType); render(); },
            setSourceType: (t) => { state.sourceType=t; state.formData.contact=t===SourceType.FILE?'1':'0'; render(); },
            updateField: (id, v) => { state.formData[id]=v; if(id!=='status'){const ns=calculateStatus(state.formData,state.type,state.importedContactValue!==undefined); if(ns)state.formData.status=ns;} render(); },
            setIsModalOpen: (v) => { state.isModalOpen=v; render(); },
            setIsDocOpen: (v) => { state.isDocOpen=v; render(); },
            setDocTab: (t) => { state.docTab=t; render(); },
            setActiveSection: (s) => { if(state.activeSection!==s){state.activeSection=s;render();} },
            handleDossierVide: () => {
                const n = {...state.formData};
                ALL_KEYS.forEach(k => {
                    if(!isFieldVisible(k,state.type)||k==='contact'||k.includes('_comm_')||k.includes('_extra')) return;
                    if(['autre_voisin_perturbe','autre_sauvage'].includes(k)) n[k]='1'; else if(['presta','Val_ROP','desserte'].includes(k)) n[k]='0'; else if(k!=='status') n[k]='0';
                    const ck=SIGNATURE_COMMENT_MAP[k]; if(ck) n[ck]=k==='pm_dechets'?'Dossier vide':'.';
                    if(k==='pm_mesure')n.pm_mesure_extra='.';if(k==='pto_mesure')n.pto_mesure_extra='.';if(k==='pm_ref_jarretieres')n.pm_comm_jarretieres='.';if(k==='pto_etiquette')n.pto_comm_etiquette='.';if(k==='pto_suspicion')n.pto_comm_suspicion='.';
                });
                n.pm_comm_dechets='Dossier vide'; n.pm_dechets='0'; n.status=calculateStatus(n,state.type,state.importedContactValue!==undefined);
                state.formData=n; render(); Swal.fire({icon:'warning',title:'Dossier Vide Appliqué',text:'Tous les éléments mis en NC.',timer:1500,showConfirmButton:false,toast:true,position:'top-end'});
            },
            handleReset: async () => {
                const r = await Swal.fire({title:'Réinitialiser ?',text:"Tout sera effacé.",icon:'warning',showCancelButton:true,confirmButtonColor:'#ef4444',cancelButtonColor:'#64748b',confirmButtonText:'Oui',cancelButtonText:'Non'});
                if(r.isConfirmed) { state.formData=getDefaultFormData(state.type,state.sourceType); state.importedContactValue=undefined; state.importedSignature=''; render(); Swal.fire({title:'Effacé !',icon:'success',timer:800,showConfirmButton:false,toast:true,position:'top-end'}); }
            },
            handleAnalysis: (txt) => {
                if(!txt||!txt.includes('[[')) return;
                const mOld=txt.match(/Par\s*:\s*([^\n\r]+)/i), mNew=txt.match(/C1\s*\(([^)]+)\)\s*:/i);
                state.importedSignature = mOld?mOld[1].trim():(mNew?mNew[1].trim():'');
                const m=txt.match(/\[\[(.*?)\]\]/s); if(!m)return;
                const p=m[1].split('\\'), n={...state.formData};
                const tV=p[0]?.trim(); if(tV) state.type=tV==='E2'?AppType.PLP_E2:tV==='E3'?AppType.PLP_E3:tV==='PLP'?AppType.PLP:AppType.RACC;
                const sV=p[1]?.trim(); if(sV) n.status=sV==='NC OK'?'CONF':sV==='NC COR'?'COR PND':sV==='NC KO'?'NC':sV;
                const O=['contact','presta','Val_ROP','desserte','pm_dechets','pm_cadrage','pm_ref_jarretieres','pm_mesure','pto_conf','pto_etiquette','pto_suspicion','pto_mesure_avant','pto_mesure','pto_photo','pto_cadrage','pbo_ref_cable','pbo_ref_pb','pbo_avant','pbo_apres','pbo_cadrage','pbo_mesure_e2','autre_penetration','autre_geoloc','autre_voisinage','autre_voisin_perturbe','autre_sauvage','autre_nacelle','autre_photo_poteau'];
                let impC=undefined;
                p.slice(2).forEach((v,i) => {
                    const k=O[i]; if(!k)return;
                    let cv=v.trim(), c=''; const vm=cv.match(/^(.*?)\s*\((.*?)\)$/); if(vm){cv=vm[1].trim();c=vm[2].trim();}
                    if(k==='contact') { impC=cv==='Avec'?'1':(cv==='Sans'?'0':cv); n[k]=impC; return; }
                    let fv=cv;
                    if(['presta','Val_ROP','desserte','autre_voisin_perturbe','autre_sauvage'].includes(k)) fv=cv==='Cor'?'Cor':(cv==='Oui'||cv==='1'?'1':'0');
                    else fv=cv==='Cor'?'Cor':cv==='1'?'1':cv==='0'?'0':cv==='NA'?'NA':cv;
                    n[k]=fv; if(COMMENT_FIELDS_MAP[k]) n[COMMENT_FIELDS_MAP[k]]=c;
                });
                state.importedContactValue=impC; state.formData=n; state.isModalOpen=false; render(); Swal.fire({icon:'success',title:'Import Réussi',timer:1200,showConfirmButton:false,toast:true,position:'top-end'});
            },
            copyToClipboard: () => {
                const text = document.getElementById('synthesis-output').value;
                navigator.clipboard.writeText(text).then(() => {
                    Swal.fire({icon:'success',title:'Copié !',timer:1000,showConfirmButton:false,toast:true,position:'top-end'});
                });
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const u = sessionStorage.getItem('vcr_username');
            if(u) { state.userName=u; state.formData=getDefaultFormData(state.type,state.sourceType); render(); }
            else {
                state.formData=getDefaultFormData(state.type,state.sourceType); render();
                Swal.fire({title:'Bienvenue',text:'Veuillez saisir votre Prénom et NOM',input:'text',inputPlaceholder:'Ex: Jacques DUPONT',allowOutsideClick:false,allowEscapeKey:false,confirmButtonText:'Valider',confirmButtonColor:'#1e293b',backdrop:`rgba(0,0,0,0.8)`,inputValidator:(v)=>!v?'Obligatoire':null}).then(r=>{if(r.isConfirmed){sessionStorage.setItem('vcr_username',r.value);state.userName=r.value;render();}});
            }
        });
    })();
  </script>
</body>
